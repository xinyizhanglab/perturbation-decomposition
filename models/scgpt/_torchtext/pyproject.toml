[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtext"
version = "0.18.0+recorded"
description = "Recorded Python vocabulary helper for scGPT checkpoint inference"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["torchtext"]

[tool.setuptools.package-data]
torchtext = ["source.json"]
