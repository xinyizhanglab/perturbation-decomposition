[project]
name = "perturbation-morph-native"
version = "0.1.0"
description = "Locked upstream MORPH training and checkpoint inference"
requires-python = ">=3.10,<3.11"
dependencies = [
    "perturbation-decomposition",
    "torch==2.10.0+cu128",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.11.4",
    "anndata==0.9.2",
    "scanpy==1.9.8",
    "scikit-learn==1.4.2",
    "numba==0.59.1",
    "wandb==0.31.0",
]

[tool.uv]
package = false

[tool.uv.sources]
perturbation-decomposition = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
