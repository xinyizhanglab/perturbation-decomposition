[project]
name = "perturbation-state-inference"
version = "0.1.0"
description = "Locked native STATE training and checkpoint inference"
requires-python = ">=3.11,<3.12"
dependencies = [
    "perturbation-decomposition",
    "arc-state==0.10.2",
    "torch==2.10.0+cu128",
    "numpy==2.4.3",
    "anndata==0.12.10",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scanpy==1.11.5",
    "scikit-learn==1.8.0",
    "lightning==2.6.1",
    "transformers==5.3.0",
    "peft==0.18.1",
    "cell-load==0.10.3",
    "cell-eval==0.6.8",
    "geomloss==0.2.6",
    "hydra-core==1.3.2",
]

[tool.uv]
package = false

[tool.uv.sources]
perturbation-decomposition = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
